  <!-- Huginn brand mark: a raven, profile facing right. Odin's thought-raven.
       Feathers-over-feet perched posture on purpose: legs turn to mud at 16px.
       ONE path, clockwise from the bill tip; the eye is an evenodd hole so the
       mark works on any background. Ink #161310, bone #E8E2DA.
       Canonical source — every icon on every platform derives from this path.
       Regenerate derived assets with generate.sh in this directory. -->
