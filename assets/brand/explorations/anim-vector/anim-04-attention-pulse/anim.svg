<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="256" height="256">
  <title>Huginn tray, attention</title>
  <!-- anim-04-attention-pulse. GENERATED by build.py; do not hand-edit. 64-unit canvas =
       the 64 px tray sprite, so every number here is a sprite pixel. Starts as the IDLE
       icon (raven in a 60x60 box at (2,2)), slides to the ATTENTION layout (50x42 box at
       (0,22), badge at (53,11) r 9) in 300 ms: EXACTLY the geometry TrayIcons.kt draws
       for both states, so the first and last frames are today's icons. Then the badge
       pops (240 ms) and a ring emerges from behind the raven, expands and fades:
       1.2 s per cycle, 2 cycles, then rest. Ring r 17 -> 27.2, stroke 4 -> 1.5 sprite px.
       The mark is <path id="raven"> (canonical path, one swap). Resting state (no
       animations) = the ATTENTION icon. -->
  <style>
    svg { --ink: #161310; }
    .ink { fill: var(--ink); }
    .mark {
      transform: translate(-5.910px, 17.586px) scale(0.5910);
      animation: huginn-slide 0.3s cubic-bezier(0.2, 0, 0, 1) both;
    }
    .ring {
      fill: none; stroke: var(--ink);
      r: 17px; stroke-width: 4; opacity: 0;
      animation: huginn-ring 1.2s linear 0.3s 2 both;
    }
    .badge {
      transform-box: fill-box; transform-origin: center;
      transform: scale(1); opacity: 1;
      animation: huginn-badge 0.24s cubic-bezier(0.2, 0, 0, 1) 0.3s both;
    }
    @keyframes huginn-slide {
      from { transform: translate(-5.092px, 1.504px) scale(0.7092); }
      to   { transform: translate(-5.910px, 17.586px) scale(0.5910); }
    }
    @keyframes huginn-ring {
      0%   { r: 17px; opacity: 0;    stroke-width: 4;   animation-timing-function: cubic-bezier(0.2, 0, 0, 1); }
      8%   { opacity: 0.85; }
      75%  { r: 27.2px; opacity: 0;    stroke-width: 1.5; }
      100% { r: 27.2px; opacity: 0;    stroke-width: 1.5; }
    }
    @keyframes huginn-badge {
      from { transform: scale(0); opacity: 0; }
      15%  { opacity: 1; }
      to   { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark, .ring, .badge { animation: none; }
    }
  </style>
  <defs>
    <path id="raven" fill-rule="evenodd" d="M94,32 C87,27.5 80,25.8 74,25.5 C72.5,19.5 64,17 58.5,19.3 C54,21.3 51,24 48,27 C41,32.5 35,37.5 30,42 L10,60 L16,69 L37,54 C40,58.5 45,61.5 51,62.5 C58,63.3 64,60 67,55.5 C70.3,50.3 71.8,45.2 70,41 L67.8,40.2 L71.3,37.8 L68.8,36.2 L72,34.8 C79,34.6 86,34.2 93,33.6 C94.6,33 94.6,32.5 94,32 Z M64.5,25.5 m-2,0 a2,2 0 1,0 4,0 a2,2 0 1,0 -4,0 Z"/>
  </defs>
  <!-- ring first: it is BEHIND the raven and emerges from under it -->
  <circle class="ring" cx="29" cy="36" r="17"/>
  <g class="mark">
    <use href="#raven" class="ink"/>
  </g>
  <circle class="ink badge" cx="53" cy="11" r="9"/>
</svg>
