<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 108 54" width="432" height="216" class="opt" id="opt-b">
  <title>Huginn thinking: eye scan</title>
  <style>
    svg { --ink: #161310; }
    .ink { fill: var(--ink); }
    #opt-b .pupil { animation: huginn-scan 2.4s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes huginn-scan {
      0%   { transform: translateX(-0.90px); }
      32%  { transform: translateX(0.90px); }
      50%  { transform: translateX(0.90px); }
      82%  { transform: translateX(-0.90px); }
      100% { transform: translateX(-0.90px); }
    }
    @media (prefers-reduced-motion: reduce) { #opt-b .pupil { animation: none; transform: none; } }
  </style>
