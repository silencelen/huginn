<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <!-- Huginn mark, r2-02-heavy: the perched raven in 10 straight edges and a circular eye hole. Every vertex sits on a 24 x 16 half-block grid over the path box: column c -> x = 4.5c, half-row r -> y = 17 + 3.4r, so the half-block / braille / 7-bit renderings in grid.txt are exact cell rasterisations of this polygon. ONE evenodd path, clockwise from the bill tip; 108 viewBox, translate(2,11), box x 13.5-94.5, y 17-68. Eye: circle r 3.5 at the centre of cell (14,3) = (65.25,28.9). Ink #161310, bone #E8E2DA. Vertices: bill tip (94.5,37.4)=cell(21,6), hook (culmen knee) (85.5,23.8)=cell(19,2), crown (54,17)=cell(12,0), nape (40.5,27.2)=cell(9,3), tail tip (13.5,57.8)=cell(3,12), tail end (18,68)=cell(4,15), under-tail notch (40.5,57.8)=cell(9,12), belly (58.5,61.2)=cell(13,13), breast (76.5,51)=cell(17,10), chin (67.5,37.4)=cell(15,6) -->
  <g transform="translate(2,11)">
    <path fill="#161310" fill-rule="evenodd" d="M94.5,37.4 L85.5,23.8 L54,17 L40.5,27.2 L13.5,57.8 L18,68 L40.5,57.8 L58.5,61.2 L76.5,51 L67.5,37.4 Z M65.25,28.9 m-3.5,0 a3.5,3.5 0 1,0 7,0 a3.5,3.5 0 1,0 -7,0 Z"/>
  </g>
</svg>
