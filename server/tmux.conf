# Huginn tmux config — tuned for multi-device (desktop <-> mobile) mirror / handoff.

set -g window-size smallest    # when mirroring, fit the smaller screen so BOTH clients see full content
set -g history-limit 50000     # generous scrollback for reviewing / picking a session back up
set -g base-index 1
setw -g aggressive-resize on
set -g allow-passthrough on     # let in-session tools push escapes out through tmux (huginn-claude-title pushes Claude's state to the tab title)
# set -g mouse on              # uncomment for touch-scroll on mobile (note: desktop drag-select then needs Shift)

# Alt-d = quick detach (2 taps on a touch keyboard; Ctrl-b d still works)
bind -n M-d detach-client

# Alt-o = detach all OTHER clients of this session (resume solo / full screen); keeps you attached.
# Lists the session's client TTYs, drops your own, detaches the rest. (## defers the format for list-clients.)
bind -n M-o run-shell "tmux list-clients -t '#{session_name}' -F '##{client_tty}' | grep -vxF '#{client_tty}' | xargs -r -n1 tmux detach-client -t"

# status bar: the one-row raven in the accent, the session name, then the keybind
# hints. Colours are Moss & Heather app tokens (assets/brand/BRAND.md): status on
# tier 1, the segment on tier 3, moss on the raven. They are hex, so tmux rounds
# them to the nearest of 256 colours unless truecolor is on; to get the exact
# values add:  set -g default-terminal "tmux-256color"  and
# set -as terminal-overrides ",*:Tc"  (see explorations/color/color-04-moss-heather/terminal/tmux.conf.snippet).
set -g status-style "bg=#1C1F1D,fg=#A2ABA5"
set -g status-left "#[fg=#7CB98E,bg=#2D3230,bold] (o> #[fg=#E2E6E1,bg=#2D3230,bold]#{session_name} #[fg=#2D3230,bg=#1C1F1D]▌#[default] #[fg=#747D77]Alt-d:detach  Alt-o:solo  ^b[:scroll#[default]  "
set -g status-left-length 72
set -g window-status-format "#[fg=#A2ABA5] #I:#W "
set -g window-status-current-format "#[fg=#E2E6E1,bold] #I:#W #[fg=#7CB98E]▌#[default]"
set -g window-status-separator ""
set -g pane-active-border-style "fg=#7CB98E"
set -g pane-border-style "fg=#3A423E"
set -g message-style "bg=#2D3230,fg=#E2E6E1"

# ---- 16-colour fallback, the commented alternative to the hex block above: for a
# terminal (or tmux) without truecolor, where the hex would be rounded to whatever
# of the 256 is nearest. ANSI names only; with moss-heather.ansi.json installed in
# the terminal these are black=#3A423E (outlineVariant), brightblack=#747D77
# (outline), white=#C8CDC9, green=#7CB98E (the accent slot); on any other palette
# they are that palette's own colours. Same layout as above. Source:
# assets/brand/explorations/color/color-04-moss-heather/terminal/tmux.conf.snippet.
