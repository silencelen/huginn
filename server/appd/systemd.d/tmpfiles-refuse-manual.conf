# Installed by huginn-appd/install.sh as
# /etc/systemd/system/systemd-tmpfiles-setup.service.d/huginn-refuse-manual.conf
#
# systemd-tmpfiles-setup.service runs `systemd-tmpfiles --create --remove --boot`.
# With the distribution's `D /tmp 1777 root root …` line that EMPTIES /tmp — fine
# at boot, when nothing lives there yet, but started by hand (to "clear" a failed
# unit, say) it unlinks the tmux socket under a running huginn-tmux.service: every
# session looks gone to every client, and every Claude Code scratchpad is deleted.
# The unit still runs at boot through sysinit.target; only a manual
# `systemctl start` is refused.
[Unit]
RefuseManualStart=yes
