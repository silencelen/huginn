# Sandboxing for a daemon that runs as root, binds 0.0.0.0, holds every Claude
# credential on the host, and can type into a root Claude Code pane. None of it
# was here before the 2026-08 audit; the set below was proven on a scratch
# instance (own port, own data dir) before being applied to the live one.
#
# ⚠ NOT PrivateTmp. tmux's server socket is /tmp/tmux-0/default, so a private
# /tmp makes every session invisible while the daemon still starts and answers
# /v1/ping perfectly — a silent, total loss of the sessions feature. Measured:
# with PrivateTmp=yes, GET /v1/sessions returned []. It is the one directive a
# reasonable person would copy from a hardening template and the one that breaks
# this service, so it is called out rather than merely omitted.
#
# ⚠ NOT ProtectHome. The daemon reads /root/.claude — the account store and the
# live credentials are the whole point of its account feature.
#
# A drop-in rather than an edit to the unit, for the same reason as the bind
# override beside it: server/appd/deploy.sh rewrites the unit file and would
# silently revert anything written there.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictRealtime=yes
# Everything it legitimately writes: its own state, the session state files under
# /run, the credential store it swaps on an account switch, and /tmp for the tmux
# socket and the scratch dirs the suggestion runs use.
#
# /root is here for ONE file, and it is not obvious: an account switch moves the
# identity block in ~/.claude.json alongside the tokens in ~/.claude/, writing
# ~/.claude.json.huginn-tmp and renaming over it. That temp file is a direct
# child of /root, so naming only /root/.claude would leave switching broken —
# and broken in the quiet way, since writeOauthAccount swallows the failure and
# returns false, which would leave the CLI reporting the account you just left.
ReadWritePaths=/var/lib/huginn-appd /run /root /tmp
