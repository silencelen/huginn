# Sandboxing for huginn-appd, installed by install.sh on every install and update.
#
# What it is for: the daemon runs as root, listens on the network and holds every
# Claude credential on the host. These directives stop the daemon, and anything it
# starts directly (chats and rounds), from changing the KERNEL: no sysctl writes,
# no module loading, no cgroup tree edits, no setuid files, no realtime
# scheduling.
#
# What it deliberately does NOT do is make the filesystem read-only
# (ProtectSystem=strict) or restrict socket families. The daemon can already type
# into root Claude Code sessions, so a read-only /usr or /etc would not contain a
# compromised daemon; it would only stop an act chat from doing what the same
# request does in a session (installing a package, editing /etc), and a socket
# filter without AF_NETLINK breaks `ip` and `ss` in chats. Sessions themselves
# run in their own unit, huginn-tmux.service, outside this sandbox.
#
# ⚠ NOT PrivateTmp. tmux's server socket is /tmp/tmux-0/default, so a private
# /tmp makes every session invisible while the daemon still starts and answers
# /v1/ping perfectly: GET /v1/sessions returns []. It is the one directive a
# reasonable person would copy from a hardening template and the one that breaks
# this service, so it is called out rather than merely omitted.
#
# ⚠ NOT ProtectHome. The daemon reads /root/.claude: the account store and the
# live credentials are the whole point of its account feature.
#
# To make the daemon and its chats stricter, add your own drop-in (for example
# ProtectSystem=strict with a ReadWritePaths= list); see systemd.d/README.md.
[Service]
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictRealtime=yes
