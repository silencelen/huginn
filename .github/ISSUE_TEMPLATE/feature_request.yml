name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: For open-ended ideas, [Discussions](https://github.com/silencelen/huginn/discussions) is often a better first stop.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The need, in your own words. What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
