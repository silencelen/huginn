# CodeQL, advanced setup — in-repo so the language matrix and build mode are
# explicit (the API's default-setup endpoint also 404'd on this repo the day it
# went public, so the visible config is the reliable one).
#
# java-kotlin runs build-mode "none": extraction without a build, so the runner
# needs no Android SDK and a Gradle issue can never take security scanning down
# with it. javascript-typescript covers the daemon (server/appd) and the
# deprecated Electron client — deprecated still ships to a running install, so
# it stays scanned.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 9 * * 3'   # weekly, Wednesday 09:31 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
