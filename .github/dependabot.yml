# Dependabot version updates, shaped around what is live and what is deprecated.
# (Security ALERTS and security-update PRs are enabled repo-side and are not
# configured here — this file governs routine version bumps.)
version: 2
updates:
  # The Kotlin apps: gradle deps pin in mobile/gradle/libs.versions.toml.
  # Compose Multiplatform is deliberately held at 1.7.3 (1.8.x needs Kotlin
  # 2.1.20+) — ignore its majors/minors so the pin is a decision, not a weekly PR.
  - package-ecosystem: gradle
    directory: /mobile
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: 'org.jetbrains.compose*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  # There is no npm ecosystem here any more. The Electron client at /desktop was
  # the only one, and it was deleted on 2026-08-27 — its stanza held the routine
  # churn to zero while still letting security PRs through, and both are moot now
  # that the tree and its package-lock.json are gone. The daemon has no npm
  # dependencies at all, by design.

  # Keep the workflows' pinned actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
