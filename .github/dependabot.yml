# Dependabot version updates, shaped around what is live and what is deprecated.
# (Security ALERTS and security-update PRs are enabled repo-side and are not
# configured here — this file governs routine version bumps.)
version: 2
updates:
  # The Kotlin apps: gradle deps pin in mobile/gradle/libs.versions.toml.
  # Compose Multiplatform is deliberately held at 1.7.3 (1.8.x needs Kotlin
  # 2.1.20+) — ignore its majors/minors so the pin is a decision, not a weekly PR.
  - package-ecosystem: gradle
    directory: /mobile
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: 'org.jetbrains.compose*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  # The DEPRECATED Electron client: no routine version churn (limit 0 stops
  # version-update PRs; Dependabot SECURITY updates still open PRs here, which
  # matches desktop/DEPRECATED.md — security and data-loss fixes only).
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # Keep the workflows' pinned actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
