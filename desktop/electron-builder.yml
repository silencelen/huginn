appId: com.silencelen.huginn.desktop
productName: Huginn
directories:
  output: dist
files:
  - out/**
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  # Per-user one-click: installs to %LOCALAPPDATA%, no UAC, no publisher
  # dialog — the friction-free shape for an unsigned household app.
  oneClick: true
  perMachine: false
  artifactName: Huginn-Setup-${version}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: silencelen
  artifactName: huginn-desktop-${version}.${ext}

# The generic provider exists so electron-builder EMITS latest.yml /
# latest-linux.yml — the runtime feed URL is injected via setFeedURL (the
# daemon address is a user setting), so this URL is never actually used.
publish:
  provider: generic
  url: http://100.97.198.90:8787/v1/desktop
