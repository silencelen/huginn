org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 8 GB build hosts (huginn LXC): cap worker fan-out and the Kotlin daemon heap.
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1536m

# AGP 9: built-in Kotlin + new DSL are incompatible with the kotlin.multiplatform
# plugin on :core/:ui (com.android.library + KMP). These two properties are the
# Google-documented bypass; the real fix is migrating :core/:ui to
# com.android.kotlin.multiplatform.library, tracked as a follow-up. They also
# keep :app on the classic kotlin.android plugin + kotlinOptions DSL.
android.builtInKotlin=false
android.newDsl=false
